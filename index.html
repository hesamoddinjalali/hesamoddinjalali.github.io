    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    color:var(--parchment);
    font-family:'Vazirmatn', sans-serif;
    position:relative;
  }

  .page{
    max-width:1100px;
    margin:0 auto;
    padding:0 24px 70px;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* ---------- header ---------- */
  header{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    align-items:center;
    padding:26px 0 18px;
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; justify-content:center; }
  .brand svg{ width:42px; height:24px; }
  .socials{ display:flex; align-items:center; gap:14px; justify-self:start; }
  .socials-left{ justify-self:end; }
  .socials a.icon{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.22);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.55);
    box-shadow: 0 4px 14px rgba(20,25,35,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
    color:var(--ink);
    transition:background .3s ease, border-color .3s ease, transform .25s ease;
  }
  .socials a.icon:hover, .socials a.icon:focus-visible{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.8);
    transform:translateY(-2px);
  }
  .socials svg{ width:15px; height:15px; }

  .signature-link{
    display:inline-block;
    cursor:pointer;
  }

  /* ---------- hero ---------- */
  .hero{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:44px 0 10px;
    gap:22px;
  }

  .signature{
    /* glasses graphic occupies 50% of the word-stage width, so 0.7x that is 35% of the stage width — but never shrink past a readable minimum */
    max-width:clamp(170px, 32.2vw, 308px);
    width:100%;
    height:auto;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
    opacity:0.55;
    transition:opacity .3s ease;
  }
  .signature-link:hover .signature,
  .signature-link:focus-visible .signature,
  .signature-link:active .signature{
    opacity:1;
  }

  .word-stage{
    width:min(880px, 92vw);
  }
  .stage-svg{ width:100%; height:auto; display:block; overflow:visible; }

  #blurWordsG, #sharpWordsG{ will-change:transform; }

  @keyframes ambientFloat{
    0%   { transform:translate(0px, 0px); }
    25%  { transform:translate(4px, -5px); }
    50%  { transform:translate(-3px, 3px); }
    75%  { transform:translate(3px, 4px); }
    100% { transform:translate(0px, 0px); }
  }
  .ambient-float{
    animation: ambientFloat 9s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .ambient-float{ animation:none; }
  }

  .word{
    text-anchor:middle;
    dominant-baseline:central;
    opacity:0;
    transition:opacity .9s ease;
  }
  .word.active{ opacity:1; }

  /* sized so both extend past the glasses edges (lens span = 620 svg units), and roughly match each other's rendered width */
  .word-fa{
    font-family:'Doran','Aref Ruqaa', serif;
    font-weight:700;
    font-size:112px;
    fill:var(--ink);
  }
  .word-en{
    font-family:'Doran','Playfair Display', serif;
    font-weight:500;
    font-style:italic;
    font-size:150px;
    letter-spacing:1px;
    fill:var(--ink);
  }

  /* ---------- action band ---------- */
  .action-band{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-top:6px;
  }
  .action-band .rule{ width:44px; height:1px; background:var(--line); }
  .actions{
    display:flex; flex-direction:column;
    align-items:center;
    gap:12px;
    width:100%;
  }
  .action-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    width:min(340px, 86vw);
    padding:14px 18px;
    background:rgba(255,255,255,0.22);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    color:var(--ink);
    border:1px solid rgba(255,255,255,0.55);
    border-radius:999px;
    box-shadow: 0 6px 20px rgba(20,25,35,0.10), inset 0 1px 0 rgba(255,255,255,0.65);
    text-decoration:none;
    font-size:13px; font-weight:500; letter-spacing:.2px;
    white-space:nowrap;
    text-align:center;
    transition:background .3s ease, border-color .3s ease, transform .2s ease, box-shadow .3s ease;
  }
  .action-btn svg{ width:16px; height:16px; flex-shrink:0; color:var(--gold); }
  .action-btn:hover, .action-btn:focus-visible{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.8);
    box-shadow: 0 10px 26px rgba(20,25,35,0.14), inset 0 1px 0 rgba(255,255,255,0.8);
    transform:translateY(-2px);
  }

  /* ---------- quote ---------- */
  .quote{ max-width:640px; margin-top:8px; }
  .quote p{ font-size:clamp(15px, 1.9vw, 18px); line-height:2.1; margin:0; }
  .quote .l2{ margin-top:14px; color:var(--muted); }

  @media (max-width: 620px){
    .socials{ gap:8px; min-width:0; }
    .action-band{ gap:12px; }
  }

  @media (max-width: 400px){
    .socials{ gap:5px; }
    .socials a.icon{ width:28px; height:28px; }
    .socials svg{ width:13px; height:13px; }
    header{ padding:18px 0 14px; }
  }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
</style>
</head>

<script>
  // word swap every 7s, synced across blur + sharp layers
  (function(){
    const pairs = [
      [document.getElementById('blurFa'), document.getElementById('sharpFa')],
      [document.getElementById('blurEn'), document.getElementById('sharpEn')]
    ];
    let showingFa = true;
    setInterval(()=>{
      showingFa = !showingFa;
      pairs[0].forEach(el => el.classList.toggle('active', showingFa));
      pairs[1].forEach(el => el.classList.toggle('active', !showingFa));
    }, 7000);
  })();

  // mouse parallax on the words only (glasses stay fixed) — kept intentionally subtle
  (function(){
    const blurLayer = document.getElementById('blurWordsG');
    const sharpLayer = document.getElementById('sharpWordsG');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce) return;

    let targetX = 0, targetY = 0, curX = 0, curY = 0;
    const maxOffset = 10; // svg user units — small enough to always stay inside the lenses (r=140)

    window.addEventListener('mousemove', (e)=>{
      const cx = window.innerWidth/2, cy = window.innerHeight/2;
      targetX = ((e.clientX - cx)/cx) * maxOffset;
      targetY = ((e.clientY - cy)/cy) * maxOffset;
    });

    function tick(){
      curX += (targetX - curX) * 0.07;
      curY += (targetY - curY) * 0.07;
      const t = `translate(${curX.toFixed(1)}px, ${curY.toFixed(1)}px)`;
      blurLayer.style.transform = t;
      sharpLayer.style.transform = t;
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
